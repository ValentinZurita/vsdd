name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build versioned source archives
        id: archives
        shell: bash
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          VERSION="$(node -p "require('./package.json').version")"
          test "$TAG" = "v$VERSION"
          mkdir -p dist
          git archive --format=tar --prefix="vsdd-${TAG}/" "$TAG" | gzip -n > "dist/vsdd-${TAG}.tar.gz"
          git archive --format=zip --prefix="vsdd-${TAG}/" --output="dist/vsdd-${TAG}.zip" "$TAG"

      - name: Attest release archives
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/vsdd-${{ github.ref_name }}.tar.gz
            dist/vsdd-${{ github.ref_name }}.zip

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "dist/vsdd-$GITHUB_REF_NAME.tar.gz"
          "dist/vsdd-$GITHUB_REF_NAME.zip"
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --title "VSDD $GITHUB_REF_NAME"
          --generate-notes
